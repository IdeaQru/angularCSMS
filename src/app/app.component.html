<!-- Cursor Trails -->
<div *ngFor="let trail of trails" class="cursor-trail"></div>

<!-- Jika di halaman login/register, tampilkan hanya router-outlet -->
<div *ngIf="isAuthPage; else mainLayout">
  <router-outlet></router-outlet>
</div>

<!-- Layout utama dashboard -->
<ng-template #mainLayout>
  <div class="dashboard-layout">
    <app-sidebar (toggle)="toggleSidebar()"></app-sidebar>
    <div [class.minimized]="isMinimized" class="content-area">
      <app-navbar></app-navbar>
      <router-outlet></router-outlet>
      <app-footer></app-footer>
    </div>
  </div>
</ng-template>
