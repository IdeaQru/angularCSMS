<div class="auth-wrapper">
  <!-- Gambar di kiri, judul di atas gambar -->
  <div class="auth-image-container left">
  <div class="auth-image left" @slideInLeft>
    
    <div class="image-title">Audit Web Apps</div>
    <img src="assets/ppns-ship.jpg" alt="PPNS Ship" class="main-image" />
  </div>
  </div>
  <!-- Form di kanan -->
  <div class="auth-card">
    <div class="auth-header">
      <i class="fas fa-user-circle"></i>
      <h2>Login</h2>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
      </div>
      <div *ngIf="error" class="error-msg">{{ error }}</div>
      <button type="submit" class="auth-btn">Login</button>
    </form>
    <p class="auth-switch">
      Belum punya akun? <a routerLink="/auth/register">Register di sini</a>
    </p>
  </div>
</div>
