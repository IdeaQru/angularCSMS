<aside class="sidebar" [class.minimized]="isMinimized">
  <!-- Tombol Minimize -->
  <button class="minimize-btn" (click)="toggleMinimize()">
    <i class="fas" [class.fa-arrow-left]="!isMinimized" [class.fa-arrow-right]="isMinimized"></i>
  </button>

  <!-- Sidebar Header -->
  <div class="sidebar-header" *ngIf="!isMinimized">
    AUDIT SMK3 Menu
  </div>

  <ul class="nav-list sidebar-nav">


    <!-- Management User hanya untuk admin -->
    <li class="nav-item" *ngIf="role === 'admin'">
      <a routerLink="/user-management" class="nav-link">
        <i class="fas fa-users-cog"></i>
        <span *ngIf="!isMinimized">Management User</span>
      </a>
    </li>
    <li class="nav-item">
      <a routerLink="/change-password" class="nav-link">
        <i class="fas fa-key"></i>
        <span *ngIf="!isMinimized">Ganti Password</span>
      </a>
    </li>
    <li class="nav-item" *ngIf=" role === 'auditee' ">
      <a routerLink="auditee/profile" class="nav-link">
        <i class="fas fa-user"></i>
        <span *ngIf="!isMinimized">Profile</span>
      </a>
    </li>
    <li class="nav-item" *ngIf=" role === 'auditor' ">
      <a routerLink="auditor/profile" class="nav-link">
        <i class="fas fa-user"></i>
        <span *ngIf="!isMinimized">Profile</span>
      </a>
    </li>
    <li class="nav-item" *ngIf="role === 'auditor' || role === 'auditee' || role === 'admin'">

      <a routerLink="/dashboard" class="nav-link">
        <i class="fas fa-tachometer-alt"></i>
        <span *ngIf="!isMinimized">Dashboard</span>
      </a>
    </li>
    <!-- Auditor menu hanya untuk auditor -->
    <li class="nav-item" *ngIf="role === 'auditor'">
      <a href="#penilaianMenu" class="nav-link dropdown-toggle" data-bs-toggle="collapse"
        [attr.aria-expanded]="!isMinimized" aria-controls="penilaianMenu">
        <i class="fas fa-tasks"></i>
        <span *ngIf="!isMinimized">Auditor</span>
      </a>
      <ul id="penilaianMenu" class="collapse" [ngClass]="{'show': !isMinimized}">
     
        <li class="nav-item">
          <a routerLink="/auditor/evaluation" class="nav-link">
            <i class="fas fa-file-alt"></i>
            <span *ngIf="!isMinimized">Evaluasi</span>
          </a>
        </li>
        <!-- <li class="nav-item">
          <a routerLink="/auditor/certification" class="nav-link">
            <i class="fas fa-chart-line"></i>
            <span *ngIf="!isMinimized">Certification</span>
          </a>
        </li> -->
        <li class="nav-item">
          <a routerLink="/auditor/kriteria" class="nav-link">
            <i class="fas fa-plus-circle"></i>
            <span *ngIf="!isMinimized">Create Criteria</span>
          </a>
        </li>

      </ul>
    </li>

    <!-- Auditee menu hanya untuk auditee -->
    <li class="nav-item" *ngIf="role === 'auditee'">
      <a href="#auditeeMenu" class="nav-link dropdown-toggle" data-bs-toggle="collapse"
        [attr.aria-expanded]="!isMinimized" aria-controls="auditeeMenu">
        <i class="fas fa-briefcase"></i>
        <span *ngIf="!isMinimized">Auditee</span>
      </a>
      <ul id="auditeeMenu" class="collapse" [ngClass]="{'show': !isMinimized}">
        <!-- Jika fitur Prequalification & Certification memang untuk Auditee, tampilkan juga di sini -->
        <li class="nav-item">
          <a routerLink="/auditee/prequalification" class="nav-link">
            <i class="fas fa-file-alt"></i>
            <span *ngIf="!isMinimized">Prequalification</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/auditee/result" class="nav-link">
            <i class="fas fa-file-alt"></i>
            <span *ngIf="!isMinimized">Evaluation & Report</span>
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/auditee/certification" class="nav-link">
            <i class="fas fa-chart-line"></i>
            <span *ngIf="!isMinimized">Certification</span>
          </a>
        </li>
      </ul>
    </li>


  </ul>

</aside>
